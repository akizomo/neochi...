# Xcode プロジェクトの定義(XcodeGen)。`xcodegen generate` で Neochi.xcodeproj を作る。
# Bundle ID は、あなたが決めたものに差し替える(docs/SETUP.md の A-2)。
name: Neochi
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  NeochiCore:
    path: .
targets:
  Neochi:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: NeochiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.neochi
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHealthShareUsageDescription: 睡眠データから入眠の時刻を推定し、寝落ちまでの分数を記録するために読み取ります。広告や外部への提供には使いません。
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        # 接続先。空なら端末内だけで動く(docs/SETUP.md)。ホスト名だけ(例: abcd.supabase.co)。
        SUPABASE_HOST: ""
        SUPABASE_ANON_KEY: ""
    info:
      path: App/Info.plist
      properties:
        UIBackgroundModes: [audio]
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    entitlements:
      path: App/Neochi.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
