# 採点ルール(初期値は仮)。コードに数値を埋め込まず、ここだけを直す。
# 人の手で個別の番組の★を動かさない。変えるのはルールだけ。

transcribe:
  front_min: 20        # 冒頭からこの分数を文字起こし。入眠までの時間の目安(15〜20分)に合わせ、内容の評価はここまで。実測が溜まったら見直す
  mid_min: 0           # 中盤のランダム区間(0 = 使わない)。音響特徴量は別に全編で計る
  whisper_model: base
  whisper_compute_type: int8

acoustic:
  sample_rate: 8000
  frame_sec: 1.0
  window_min: 30             # 音量のばらつき・突発音は、冒頭からこの分数だけで測る(寝落ちの線に合わせる。入眠後は見ない)
  silence_floor_db: -60      # これ未満のフレームは音量ばらつきに含めない
  # 突発音 = 「それまでの音」より急に大きい音。回全体の中央値ではなく、直前の sudden_context_sec 秒の中央値と比べる。
  # (全体の中央値で比べると、抑揚の大きい朗読で、ふつうの語りの山を、すべて突発音と数えてしまう。実データ12回で確認)
  sudden_context_sec: 60
  sudden_over_context_db: 12 # 直前の中央値より+12dB超
  sudden_over_prev_db: 8     # かつ直前のフレームから+8dB超
  warn_sudden_per_10min: 100 # 超えたら警告ログ(異常値)

# 前半の重み: 寝つきに関わる指標(話す速さ・速さのばらつき)は、冒頭からの区間ごとに重みを付けて平均する。
# 健康な成人の平均入眠は10〜20分程度なので、前半を重く見る。数値は仮。
# 途中で起こさないための指標(突発音・音量のばらつき)は全編で同じ重み。
front_weight:
  window_min: 10
  weights: [3, 2]           # 0〜10分 ×3、10〜20分 ×2
  mid_weight: 0             # 30分以降(文字起こしする場合のみ)

# 🎧 耳のゆるさ: 各指標を 0〜1 にして重み付き平均 → ★1〜5
ear:
  weights: {rate: 0.3, rate_cv: 0.2, volume: 0.25, sudden: 0.25}
  # 話す速さ: 「遅いほど良い」ではなく、best_max 以下を満点にする(台形)。
  # 遅すぎ側の減点は根拠がないので、実測が溜まるまで入れない(slow_floor: null)。
  # best_max は基準データ48本の上位(★4以上)が収まった範囲から仮置き(Whisper base・無音除きの字/分)。
  rate:
    ja: {best_max: 290, worst: 450, slow_floor: null}   # 字/分
    en: {best_max: 130, worst: 200, slow_floor: null}   # 語/分
  # 速さのばらつき: 1分ごとの話す速さの変動係数。速さの変化が小さいほど聞き取りやすいという研究(睡眠ではない)に基づく仮説
  rate_cv: {best: 0.10, worst: 0.40}
  volume_std_db: {best: 4, worst: 12}
  sudden_per_10min: {best: 0, worst: 10}

# 評点の元(AI解析の総合)。🎯は mid を最良とする(興味が強すぎても弱すぎても落ちにくい)
total:
  weights: {interest: 0.3, calm: 0.4, ear: 0.3}
  # 引き込み力(1〜10)のゾーン。数値は仮説。実測(どの段階で早く眠れたか)が溜まったら見直す
  interest_zone:
    zone: [4, 6]          # この範囲は🎯★5
    low_end: [1, 3.0]     # 退屈すぎ(雑念が戻る)
    high_end: [10, 1.0]   # 引き込まれすぎ(聞き続けてしまう)。退屈より悪いとみる
  interest_star: {low: 3.0, mid: 5.0, high: 2.0}   # 旧形式(3段階のみ)の判定用

# 総合評点(final_star。格付けとアプリの評点はこれ)。docs/SCORE.md §2。数値は仮。
# AI解析(total)を土台に、実測とみんなの評価を件数に応じて足す。件数が下限未満の項目は、計算にも画面にも入れない。
final:
  # みんなの評価は、話の内容の軸(🌊🎯)にだけ、軸ごとに足す。🎧は音響の計算だけ。実測は総合に足す。
  community_min_n: 10       # みんなの評価は、軸ごとにこの件数から使う
  community_prior_n: 30     # w = n / (n + prior_n)。10件で 0.25、30件で上限 0.5
  community_max_weight: 0.5 # 軸ごとの上限(総合への効きは、最大でも約0.35)
  # みんなの🎯は10段階(sleep_log.interest_rating)。AIと同じゾーンの式(total.interest_zone)で★に直す。
  # 10段階の導入前の3択(interest_vote)は、同じ★になる段に読み替える(退屈だった=1→3.0 / ちょうどよかった=5→5.0 / 聴き入った=10→1.0)
  interest_vote_legacy_rating: {-1: 1, 0: 5, 1: 10}
  divergence_threshold: 1.0 # AI解析と、実測・みんなの差がこの点以上なら final_reason に一行
  watch_min_n: 3            # ウォッチの実測は、この件数から使う
  watch_prior_n: 5
  watch_max_weight: 0.6
  watch_best_min: 10        # 実測の中央値がこの分数以下で 5.0
  watch_worst_min: 40       # この分数以上で 1.0(その間は直線)

llm:
  model: claude-sonnet-5-5
  max_tokens: 400
  max_chars: 12000          # LLMに渡す文字起こしの上限
