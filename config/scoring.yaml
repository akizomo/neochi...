# 採点ルール(初期値は仮)。コードに数値を埋め込まず、ここだけを直す。
# 人の手で個別の番組の★を動かさない。変えるのはルールだけ。

transcribe:
  front_min: 30        # 冒頭からこの分数を文字起こし。30分以降を聞くのは寝つけなかった人だけなので、内容の評価はここまで
  mid_min: 0           # 中盤のランダム区間(0 = 使わない)。音響特徴量は別に全編で計る
  whisper_model: base
  whisper_compute_type: int8

acoustic:
  sample_rate: 8000
  frame_sec: 1.0
  silence_floor_db: -60      # これ未満のフレームは音量ばらつきに含めない
  sudden_over_median_db: 10  # 中央値より+10dB超
  sudden_over_prev_db: 6     # かつ直前から+6dB超
  warn_sudden_per_10min: 100 # 超えたら警告ログ(異常値)

# 前半の重み: 寝つきに関わる指標(話す速さ・速さのばらつき)は、冒頭からの区間ごとに重みを付けて平均する。
# 健康な成人の平均入眠は10〜20分程度なので、前半を重く見る。数値は仮。
# 途中で起こさないための指標(突発音・音量のばらつき)は全編で同じ重み。
front_weight:
  window_min: 10
  weights: [3, 2, 1]        # 0〜10分 ×3、10〜20分 ×2、20〜30分 ×1
  mid_weight: 0             # 30分以降(文字起こしする場合のみ)

# 🎧 耳のゆるさ: 各指標を 0〜1 にして重み付き平均 → ★1〜5
ear:
  weights: {rate: 0.3, rate_cv: 0.2, volume: 0.25, sudden: 0.25}
  # 話す速さ: 「遅いほど良い」ではなく、best_max 以下を満点にする(台形)。
  # 遅すぎ側の減点は根拠がないので、実測が溜まるまで入れない(slow_floor: null)。
  # best_max は基準データ48本の上位(★4以上)が収まった範囲から仮置き(Whisper base・無音除きの字/分)。
  rate:
    ja: {best_max: 290, worst: 450, slow_floor: null}   # 字/分
    en: {best_max: 130, worst: 200, slow_floor: null}   # 語/分
  # 速さのばらつき: 1分ごとの話す速さの変動係数。速さの変化が小さいほど聞き取りやすいという研究(睡眠ではない)に基づく仮説
  rate_cv: {best: 0.10, worst: 0.40}
  volume_std_db: {best: 4, worst: 12}
  sudden_per_10min: {best: 0, worst: 10}

# 😴 要因の総合(AI解析)。🎯は mid を最良とする(興味が強すぎても弱すぎても落ちにくい)
total:
  weights: {interest: 0.3, calm: 0.4, ear: 0.3}
  interest_star: {low: 3.0, mid: 5.0, high: 2.0}

# 最終★: みんなの評価が入ったらAI解析と混ぜる。みんなが0件の間は AI解析のみ。
final:
  community_prior_n: 10     # w = n / (n + prior_n)
  community_max_weight: 0.5
  divergence_threshold: 1.0 # AI解析とみんなの差がこの★以上なら final_reason に一行

llm:
  model: claude-sonnet-5-5
  max_tokens: 400
  max_chars: 12000          # LLMに渡す文字起こしの上限
